          saveState();
        }

        function scheduleHistory() {
          clearTimeout(historyTimer);
          if (!restoring && (historyArmed || restoreTimeRange)) historyTimer = setTimeout(loadHistory, 120);
        }
        async function loadHistory() {
          if (historyBusy || restoring || timeframePicker.disabled) return;
          const range = chart.timeScale().getVisibleLogicalRange();
          if (!range) return;
          const targets = panes.flatMap(pane => pane.entries.filter(entry => {
            if (!entry.visible || entry.data.start <= 0) return false;
            const bars = entry.api.barsInLogicalRange(range);
            return bars && bars.barsBefore < 200;
          }).map(entry => ({ pane, entry })));
          if (!targets.length) { restoreTimeRange = null; return; }
          historyBusy = true;
          const currentGeneration = generation, index = timeframe;
          let failed = false;
          try {
            const outcomes = await Promise.allSettled(targets.map(async ({ pane, entry }) => {
              if (generation !== currentGeneration || !pane.entries.includes(entry)) return;
              const previous = entry.data;
              const earlier = await fetchSeries(entry.name, index, Math.max(0, previous.start - pageSize), previous.start);
              if (generation !== currentGeneration || !pane.entries.includes(entry)) return;
              if (!earlier.data.length || earlier.end !== previous.start || earlier.type !== previous.type || earlier.version !== previous.version) throw new Error(`${entry.name}: history changed; reload to retry.`);
              const merged = {
                ...previous, start: earlier.start,
                data: [...earlier.data, ...previous.data],
                timestamps: { ...previous.timestamps, start: earlier.timestamps.start, data: [...earlier.timestamps.data, ...previous.timestamps.data] },
              };
              const visible = restoreTimeRange || chart.timeScale().getVisibleRange();
              setSeriesData(entry, merged);
              if (visible) chart.timeScale().setVisibleRange(visible);
              updateVisibility(pane);
            }));
            const failure = outcomes.find(result => result.status === "rejected");
            if (failure) throw failure.reason;
          } catch (error) {
            failed = true;
            if (generation === currentGeneration) status.textContent = `Could not load earlier values: ${error.message}`;
          } finally {
            historyBusy = false;
            if (generation === currentGeneration) {
              saveState();
              if (!failed) scheduleHistory();
            } else scheduleHistory();
          }
        }

        const breadcrumbs = document.getElementById("catalog-path");
        const catalogInfo = document.getElementById("catalog-info");
        let catalogPath = [];
        let addingSeries = false;

        function renderBreadcrumbs(path, searching = false) {
          breadcrumbs.replaceChildren();
          const parts = ["Browse", ...path];
          parts.forEach((part, index) => {
            if (index) breadcrumbs.append(" / ");
            const button = document.createElement("button");
            button.textContent = part.replaceAll("_", " ");
            if (!searching && index === parts.length - 1) button.setAttribute("aria-current", "location");
            button.onclick = () => browseCatalog(path.slice(0, index));
            breadcrumbs.append(button);
          });
          if (searching) breadcrumbs.append(" / Search results");
        }

        function createAddButton(entry) {
          const button = document.createElement("button");
          button.className = "catalog-row";
          const exists = targetPane.entries.some(item => item.name === entry.name);
          button.textContent = exists ? "Added" : "Add";
          button.disabled = !entry.available || exists;
          button.title = entry.reason || `Add ${entry.name} to this panel`;
          button.setAttribute("aria-label", button.title);
          button.onclick = async () => {
            if (addingSeries) return;
            addingSeries = true;
            const pane = targetPane, version = searchVersion;
            button.disabled = true;
            pickerError.textContent = "";
            picker.setAttribute("aria-busy", "true");
            catalogInfo.textContent = "Adding series…";
            try {
              const data = await fetchSeries(entry.name);
              addSeries(pane, entry.name, data);
              if (version === searchVersion) picker.close();
            } catch (error) {
              if (version === searchVersion) pickerError.textContent = error.message;
            } finally {
              addingSeries = false;
              picker.removeAttribute("aria-busy");
              button.disabled = pane.entries.some(item => item.name === entry.name);
              if (version === searchVersion) catalogInfo.textContent = "";
            }
          };
          return button;
        }

        function renderCatalogResponse(response, append = false) {
          if (!append) results.replaceChildren();
          if (!response.items.length) {
            const empty = document.createElement("p");
            empty.textContent = "No matches. Try a shorter name.";
            empty.style.padding = "0.625rem";
            results.append(empty);
          }
          response.items.forEach(entry => {
            const row = entry.branch ? document.createElement("button") : createAddButton(entry);
            row.className = "catalog-row";
            const title = document.createElement("span");
            title.className = "catalog-name";
            title.textContent = entry.branch ? entry.label.replaceAll("_", " ") : entry.name + (entry.qualifier ? ` · ${entry.qualifier}` : "");
            const meta = document.createElement("span");
            meta.className = "catalog-meta";
            const exists = !entry.branch && targetPane.entries.some(item => item.name === entry.name);
            meta.textContent = entry.branch ? `${entry.count.toLocaleString()}  ›` : exists ? "Added" : entry.reason || "";
            row.replaceChildren(title, meta);
            row.title = entry.branch ? entry.path.join(" / ") : `${entry.name} · ${entry.indexes.join(" / ")}`;
            row.setAttribute("aria-label", entry.branch ? `Browse ${title.textContent}` : `${exists ? "Added" : "Add"} ${title.textContent}${entry.reason ? `: ${entry.reason}` : ""}`);
            row.dataset.path = JSON.stringify(entry.path);
            if (entry.branch) {
              row.dataset.branch = "true";
              row.onclick = () => browseCatalog(entry.path, 0, []);
            }
            results.append(row);
          });
          if (!append) results.scrollTop = 0;
          if (response.total > response.offset + response.items.length) {
            const more = document.createElement("button");
            more.className = "catalog-more"; more.textContent = "Show more";
            more.onclick = async () => {
              more.disabled = true;
              await browseCatalog(catalogPath, response.offset + response.items.length);
              more.remove();
            };
            results.append(more);
          }
        }

        async function browseCatalog(path = catalogPath, offset = 0, focusPath = null) {
          const version = ++searchVersion;
          clearTimeout(searchTimer);
          search.value = ""; catalogPath = path;
          renderBreadcrumbs(path);
          pickerError.textContent = "";
          try {
            await loadCatalog();
            if (version !== searchVersion) return;
            catalogInfo.textContent = "";
            const response = await catalogRequest("browse", { path, offset });
            if (version === searchVersion) {
              renderCatalogResponse(response, offset > 0);
              if (!offset) {
                const rows = [...results.querySelectorAll("button:not(:disabled)")];
                const focus = focusPath
                  ? rows.find(row => row.dataset.path === JSON.stringify(focusPath)) || rows[0] || search
                  : search;
                focus.focus({ preventScroll: true });
              }
            }
          } catch (error) {
            if (version !== searchVersion) return;
            results.textContent = error.message;
            const retry = document.createElement("button"); retry.textContent = "Retry";
            retry.onclick = () => browseCatalog(path);
            results.append(retry);
          }
        }

        search.addEventListener("input", () => {
          clearTimeout(searchTimer);
          const version = ++searchVersion, query = search.value.trim();
          if (!query) { void browseCatalog(); return; }
          pickerError.textContent = "";
          searchTimer = setTimeout(async () => {
            try {
              await loadCatalog();
              if (version !== searchVersion) return;
              catalogInfo.textContent = "";
              const response = await catalogRequest("search", { query });
              if (version === searchVersion) {
                renderBreadcrumbs([], true);
                renderCatalogResponse(response);
              }
            } catch (error) {
              if (version === searchVersion) pickerError.textContent = error.message;
            }
          }, 80);
        });
        results.addEventListener("focusin", event => {
          event.target.closest("button")?.scrollIntoView({ block: "nearest", inline: "nearest" });
        });
        let escapeHeld = false;
        window.addEventListener("keydown", event => {
          if (event.key !== "Escape" || (!picker.open && !seriesConfig.matches(":popover-open") && !chartLibrary.matches(":popover-open") && !escapeHeld)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          if (escapeHeld) return;
          escapeHeld = true;
          if (picker.open) picker.close();
          else if (seriesConfig.matches(":popover-open")) seriesConfig.hidePopover();
          else if (chartLibrary.matches(":popover-open")) chartLibrary.hidePopover();
        }, true);
        window.addEventListener("keyup", event => {
          if (event.key !== "Escape" || !escapeHeld) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          escapeHeld = false;
        }, true);
        window.addEventListener("blur", () => { escapeHeld = false; });
        picker.addEventListener("cancel", event => {
          event.preventDefault();
          event.stopPropagation();
          picker.close();
        });
        picker.addEventListener("keydown", event => {
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            const rows = [...results.querySelectorAll("button:not(:disabled)")];
            if (!rows.length) return;
            event.preventDefault();
            const current = rows.indexOf(document.activeElement);
            const next = current < 0 ? (event.key === "ArrowDown" ? 0 : rows.length - 1)
              : (current + (event.key === "ArrowDown" ? 1 : -1) + rows.length) % rows.length;
            rows[next].focus({ preventScroll: true });
          } else if (event.key === "Enter" && document.activeElement === search) {
            event.preventDefault();
            results.querySelector("button:not(:disabled)")?.click();
          } else if (event.key === "ArrowRight" && !event.altKey && !event.ctrlKey && !event.metaKey && !event.shiftKey) {
            const focused = document.activeElement;
            const row = focused === search && !search.value
              ? results.querySelector("button:not(:disabled)") : focused;
            if (!results.contains(row) || row?.dataset.branch !== "true") return;
            event.preventDefault();
            row.click();
          } else if (event.key === "ArrowLeft" && catalogPath.length
            && (event.altKey || document.activeElement !== search || !search.value)
            && !event.ctrlKey && !event.metaKey && !event.shiftKey) {
            event.preventDefault();
            void browseCatalog(catalogPath.slice(0, -1), 0, catalogPath);
          }
        });
        picker.addEventListener("click", event => {
          if (event.target !== picker) return;
          const rect = picker.getBoundingClientRect();
          if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) picker.close();
        });
        picker.addEventListener("close", () => { ++searchVersion; clearTimeout(searchTimer); });
        timeframePicker.onchange = async () => {
          const next = timeframePicker.value;
          ++generation;
          restoreTimeRange = null;
          historyArmed = false;
          clearTimeout(historyTimer);
          timeframePicker.disabled = true;
          document.getElementById("chart").dataset.loading = "true";
          document.querySelectorAll(":is(.pane-legend, .pane-controls) button").forEach(control => { control.disabled = true; });
          if (seriesConfig.matches(":popover-open")) seriesConfig.hidePopover();
          const visibleRange = chart.timeScale().getVisibleRange();
          const snapshots = panes.map(pane => ({ pane, entries: [...pane.entries, ...pane.unloaded].map(({ name, title, color, visible, chartType, chartOptions }) => ({ name, title, color, visible, chartType, chartOptions })) }));
          status.textContent = `Loading ${next}…`;
          const loaded = await Promise.all(snapshots.map(snapshot => Promise.allSettled(snapshot.entries.map(entry => fetchSeries(entry.name, next)))));
          if (loaded.flat().length && loaded.flat().every(result => result.status === "rejected")) {
            status.textContent = `Could not load ${next}: ${loaded.flat()[0].reason.message}`;
            timeframePicker.value = timeframe;
            timeframePicker.disabled = false;
            delete document.getElementById("chart").dataset.loading;
            panes.forEach(renderLegend);
            return;
          }
          restoring = true;
          timeframe = next;
          const failures = [];
          snapshots.forEach((snapshot, i) => {
            const pane = snapshot.pane, old = pane.entries;
            pane.entries = []; pane.unloaded = [];
            old.forEach(entry => { if (entry.ohlcApi) chart.removeSeries(entry.ohlcApi); chart.removeSeries(entry.api); });
            loaded[i].forEach((result, j) => {
              const options = snapshot.entries[j];
              try {
                if (result.status === "rejected") throw result.reason;
                addSeries(pane, options.name, result.value, options);
              } catch (error) { pane.unloaded.push(options); failures.push(`${options.name}: ${error.message}`); console.warn(error); }
            });
            updateVisibility(pane); renderLegend(pane);
          });
          applyTimeframe();
          if (panes.some(pane => pane.entries.length)) {
            if (visibleRange) chart.timeScale().setVisibleRange(visibleRange);
            else chart.timeScale().fitContent();
          }
          panes.forEach(updateVisibility);
          requestAnimationFrame(() => panes.forEach(pane => mountLegend(pane)));
          restoring = false;
          status.textContent = failures.length ? `Could not load at ${next}: ${failures.join("; ")}. Kept in saved state.` : "";
          delete document.getElementById("chart").dataset.loading;
          timeframePicker.disabled = false;
          saveState();
        };
        const chartLibrary = document.getElementById("chart-library");
        const libraryList = document.getElementById("library-list");
        const sortChoices = document.getElementById("library-sort");
        const newChartButton = document.getElementById("new-chart");
        let switchingChart = false;
        renderLibrary = () => {
          document.getElementById("library-count").textContent = String(library.charts.length).padStart(2, "0");
          for (const button of sortChoices.children) button.setAttribute("aria-pressed", String(button.dataset.sort === library.sort));
          libraryList.replaceChildren(...sortedCharts().map(entry => {
            const button = document.createElement("button");
            button.className = "library-chart";
            button.setAttribute("aria-current", String(entry.id === library.activeId));
            button.disabled = switchingChart;
            const title = document.createElement("span");
            title.textContent = entry.state.title || "Untitled chart";
            const metadata = document.createElement("small");
            const details = document.createElement("span");
            const seriesCount = entry.state.panes.reduce((count, pane) => count + (pane.series?.length || 0), 0);
            details.textContent = `${indexLabels[entry.state.timeframe] || entry.state.timeframe || "1d"} · ${seriesCount} series`;
            const date = document.createElement("time");
            const key = library.sort === "name" ? "changed" : library.sort;
            const timestamp = new Date(entry[key]);
            if (Number.isFinite(timestamp.getTime())) {
              date.dateTime = timestamp.toISOString();
              date.textContent = timestamp.toLocaleDateString(undefined, { month: "short", day: "numeric", ...(timestamp.getFullYear() !== new Date().getFullYear() ? { year: "numeric" } : {}) });
              date.title = `${sortLabels[key]} ${timestamp.toLocaleString()}`;
            }
            const rowTitle = document.createElement("span");
            rowTitle.className = "library-row-title";
            rowTitle.append(title, date);
            metadata.append(details);
            button.title = entry.state.title || "Untitled chart";
            button.append(rowTitle, metadata);
            button.onclick = () => switchChart(entry);
            return button;
          }));
          newChartButton.disabled = switchingChart;
        };
        for (const [key, label] of Object.entries(sortLabels)) {
          const button = document.createElement("button");
          button.textContent = label;
          button.dataset.sort = key;
          button.onclick = () => {
            library.sort = key;
            try { persistLibrary(); } catch { status.textContent = "Could not save chart sorting."; }
            renderLibrary();
          };
          sortChoices.append(button);
        }
        async function switchChart(entry, create = false) {
          if (switchingChart || restoring || timeframePicker.disabled || addingSeries || (!create && entry.id === library.activeId)) return;
          saveState();
          switchingChart = true;
          if (create) library.charts.push(entry);
          library.activeId = entry.id;
          entry.viewed = Date.now();
          try { persistLibrary(); } catch { status.textContent = "Could not save chart selection."; }
          renderLibrary();
          try {
            await loadChartState(entry.state);
            if (create) { chartTitle.focus(); chartTitle.select(); }
          } catch (error) { status.textContent = `${error.message} Reload to retry.`; }
          finally { switchingChart = false; renderLibrary(); }
        }
        newChartButton.onclick = () => switchChart(newChartRecord(), true);
        libraryList.addEventListener("keydown", event => {
          if (!["ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) return;
          const rows = [...libraryList.querySelectorAll("button:not(:disabled)")];
          if (!rows.length) return;
          event.preventDefault();
          const current = rows.indexOf(document.activeElement);
          const next = event.key === "Home" ? 0 : event.key === "End" ? rows.length - 1
            : Math.max(0, Math.min(rows.length - 1, current + (event.key === "ArrowDown" ? 1 : -1)));
          rows[next].focus();
        });
        async function loadChartState(state) {
          restoring = true;
          generation++;
          clearTimeout(saveTimer);
          clearTimeout(historyTimer);
          historyArmed = false;
          timeframePicker.disabled = true;
          chartTitle.disabled = true;
          document.getElementById("chart").dataset.loading = "";
          if (picker.open) picker.close();
          if (seriesConfig.matches(":popover-open")) seriesConfig.hidePopover();
          for (const pane of panes.splice(0)) {
            for (const entry of pane.entries) {
              if (entry.ohlcApi) chart.removeSeries(entry.ohlcApi);
              chart.removeSeries(entry.api);
            }
            pane.legend.remove();
            pane.controls.remove();
          }
          for (let index = chart.panes().length - 1; index > 0; index--) chart.removePane(index);
          panes.length = 0;
          timeframe = timeframes.some(frame => frame.index === state?.timeframe) ? state.timeframe : "day1";
          timeframePicker.value = timeframe;
          chartTitle.value = state?.title || "Untitled chart";
          restoreTimeRange = state?.timeRange || null;
          applyTimeframe();
          status.textContent = "Loading chart…";
          const initialPanes = state?.panes.slice(0, maxPanes) || [{ series: [{ name: "price_ohlc" }] }];
          const failed = [], initialLoads = [];
          let firstSeries = true;
          for (const [index, savedPane] of initialPanes.entries()) {
            if (index) chart.addPane(true);
            const pane = setupPane(index);
            const entries = Array.isArray(savedPane?.series) ? savedPane.series : [];
            const unique = [...new Map(entries.filter(entry => typeof entry?.name === "string").map(entry => [entry.name, entry])).values()];
            if (Number.isFinite(savedPane?.stretch) && savedPane.stretch > 0) chart.panes()[index].setStretchFactor(savedPane.stretch);
            initialLoads.push(...unique.map(async options => {
              try {
                const data = await fetchSeries(options.name);
                addSeries(pane, options.name, data, options);
                pane.entries.sort((a, b) => unique.findIndex(item => item.name === a.name) - unique.findIndex(item => item.name === b.name));
                syncSeriesOrder(pane);
                updateVisibility(pane);
                renderLegend(pane);
                if (firstSeries) {
                  firstSeries = false;
                  chart.timeScale().fitContent();
                  status.textContent = "";
                }
              } catch (error) {
                pane.unloaded.push(options);
                failed.push(`${options.name}: ${error.message}`);
                console.warn(error);
              }
            }));
          }
          await Promise.all(initialLoads);
          const range = state?.range;
          if (Number.isFinite(restoreTimeRange?.from) && Number.isFinite(restoreTimeRange?.to) && restoreTimeRange.from < restoreTimeRange.to) chart.timeScale().setVisibleRange(restoreTimeRange);
          else {
            restoreTimeRange = null;
            if (Number.isFinite(range?.from) && Number.isFinite(range?.to) && range.from < range.to && panes.every(pane => pane.entries.every(entry => entry.data.start === 0))) chart.timeScale().setVisibleLogicalRange(range);
            else chart.timeScale().fitContent();
          }
          panes.forEach(updateVisibility);
          panes.forEach(renderLegend);
          restoring = false;
          status.textContent = failed.length ? `Could not load ${failed.join(", ")}. Reload to retry; saved series are preserved.` : "";
          saveState(false);
          timeframePicker.disabled = false;
          chartTitle.disabled = false;
          delete document.getElementById("chart").dataset.loading;
          scheduleHistory();
        }
        switchingChart = true;
        renderLibrary();
        await loadChartState(savedState);
        switchingChart = false;
        renderLibrary();
        chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
          panes.forEach(updateVisibility);
          scheduleHistory();
          clearTimeout(saveTimer);
          saveTimer = setTimeout(saveState, 200);
        });
        for (const event of ["wheel", "pointerdown", "keydown"]) document.getElementById("chart").addEventListener(event, () => {
          historyArmed = true;
          restoreTimeRange = null;
        }, { passive: true });
        document.getElementById("chart").addEventListener("pointerup", () => requestAnimationFrame(saveState));
        window.addEventListener("pagehide", saveState);
        document.addEventListener("visibilitychange", () => { if (document.hidden) saveState(); });
        function positionInterval() {
          timeframePicker.style.bottom = `${chart.timeScale().height() / parseFloat(getComputedStyle(document.documentElement).fontSize) + 0.5}rem`;
        }
        chart.timeScale().subscribeSizeChange(positionInterval);
        requestAnimationFrame(positionInterval);

      } catch (error) {
        status.textContent = `${error.message} Reload to retry.`;
      }
    </script>
  </body>
</html>
